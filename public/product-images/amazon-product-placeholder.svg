  <title id="title">Amazon product awaiting review</title>
  <desc id="desc">A neutral Pasifika Bazaar product illustration used until a product-specific image is added.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7f5"/>
      <stop offset="1" stop-color="#fff0e9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5967"/>
      <stop offset="1" stop-color="#08313d"/>
